<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="960" height="620" fill="#FBFAF7"/><rect x="380" y="44" width="200" height="52" rx="10" fill="#F8E1C8" stroke="#D9A877" stroke-width="1.5"/>
<text x="480.0" y="76.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">Владелец</text>
<text x="600" y="75" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="600" dy="0">ставит задачу и принимает итог</tspan></text>
<rect x="340" y="220" width="280" height="140" rx="10" fill="#CFE2F6" stroke="#7FA7D1" stroke-width="1.5"/>
<text x="480.0" y="296.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#2B2B2B">Агент</text>
<text x="520" y="196" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="520" dy="0">главная сессия Claude: планирует,</tspan><tspan x="520" dy="16">раздаёт работу, отвечает владельцу</tspan></text>
<text x="60" y="146" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="60" dy="0">чем руководствуется агент</tspan></text>
<rect x="60" y="168" width="180" height="44" rx="10" fill="#E5DDF4" stroke="#A797CC" stroke-width="1.5"/>
<text x="150.0" y="196.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">Правила</text>
<text x="60" y="230" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="60" dy="0">постоянные указания: что можно,</tspan><tspan x="60" dy="16">что нельзя, как отвечать</tspan></text>
<polyline points="240,190 340,250" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="268" width="180" height="44" rx="10" fill="#E5DDF4" stroke="#A797CC" stroke-width="1.5"/>
<text x="150.0" y="296.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">Скиллы</text>
<text x="60" y="330" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="60" dy="0">инструкции под конкретное дело;</tspan><tspan x="60" dy="16">агент берёт нужную</tspan></text>
<polyline points="240,290 340,290" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="368" width="180" height="44" rx="10" fill="#E5DDF4" stroke="#A797CC" stroke-width="1.5"/>
<text x="150.0" y="396.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">Хуки</text>
<text x="60" y="430" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="60" dy="0">автоматические сторожа:</tspan><tspan x="60" dy="16">срабатывают на действия агента</tspan></text>
<polyline points="240,390 340,330" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="730" y="288" width="160" height="44" rx="10" fill="#FFF0B8" stroke="#D6B74E" stroke-width="1.5"/>
<text x="810.0" y="316.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">MCP</text>
<text x="810" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="810" dy="0">подключаемые инструменты и</tspan><tspan x="810" dy="16">сервисы: поиск по коду и</tspan><tspan x="810" dy="16">документам, браузер, другие</tspan></text>
<polyline points="730,310 620,310" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="260" y="496" width="160" height="48" rx="10" fill="#F6D5D8" stroke="#CF8F96" stroke-width="1.5"/>
<text x="340.0" y="526.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">Jev</text>
<text x="340" y="568" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="340" dy="0">проверяющий: сверяет результат</tspan><tspan x="340" dy="16">с файлами на диске</tspan></text>
<rect x="525" y="496" width="190" height="48" rx="10" fill="#D6EED8" stroke="#86B98C" stroke-width="1.5"/>
<text x="620.0" y="526.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2B2B2B">Субагенты</text>
<text x="620" y="568" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6B6B6B"><tspan x="620" dy="0">помощники агента (Flash, Sonnet, Haiku):</tspan><tspan x="620" dy="16">выполняют задания</tspan></text>
<polyline points="810,332 810,520 715,520" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<polyline points="468,96 468,220" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<polyline points="492,220 492,96" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="154" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">задача</text>
<text x="500" y="154" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">ответ</text>
<polyline points="560,360 560,496" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<polyline points="584,496 584,360" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="552" y="432" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">задание</text>
<text x="592" y="432" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">готово</text>
<polyline points="370,360 370,496" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<polyline points="394,496 394,360" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="362" y="432" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">проверь</text>
<text x="402" y="432" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">да / нет</text></svg>
